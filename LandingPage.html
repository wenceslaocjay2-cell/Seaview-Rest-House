<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Landing Page- SeaView Rest House</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    color: white;
    background: linear-gradient(120deg, #ff7e5f, #feb47b, #ff6f91, #ff9671);
    background-size: 400% 400%;
    animation: gradientBG 18s ease infinite;
    overflow-x: hidden;
}

/* Gradient animation */
@keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* Smooth fade-in */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Header */
.header {
    text-align: center;
    padding: 40px 20px;
    animation: fadeIn 1.5s ease;
}

.header h1 {
    font-size: 40px; /* mobile-friendly size */
    text-shadow: 0 0 10px #00d4ff, 0 0 20px #0099cc;
    letter-spacing: 2px;
    font-weight: 600;
    margin: 0;
}

.header h2 {
    font-size: 16px;
    margin-top: 5px;
    text-shadow: 0 0 10px #ff4f4f;
    font-weight: 300;
}

/* Navigation - horizontal for mobile */
nav {
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 10px;
    margin-top: 10px;
    flex-wrap: wrap; /* wrap if screen is narrow */
    backdrop-filter: blur(5px);
}

nav a {
    padding: 6px 12px;
    border-radius: 8px;
    background: rgba(255,255,255,0.1);
    color: white;
    font-size: 14px;
    text-decoration: none;
    font-weight: 600;
    box-shadow: 0 0 6px rgba(255,255,255,0.3);
    text-align: center;
    transition: 0.3s;
}

nav a:hover {
    color: #00eaff;
    box-shadow: 0 0 12px #00eaff;
    transform: translateY(-2px);
}

/* Section title */
.section-title {
    text-align: center;
    font-size: 28px;
    margin-top: 30px;
    text-shadow: 0 0 15px cyan;
    font-weight: bold;
    animation: fadeIn 2s ease;
}

/* Gallery */
.gallery {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    margin: 20px 0 40px 0;
}

.gallery img {
    width: 90%;
    height: auto;
    border-radius: 15px;
    box-shadow: 0 0 15px rgba(255,255,255,0.4);
    transition: 0.4s;
    animation: floating 4s ease-in-out infinite;
}

@keyframes floating {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
}

.gallery img:hover {
    transform: scale(1.05);
    box-shadow: 0 0 25px cyan;
}

/* Mobile responsiveness */
@media only screen and (max-width: 480px) {
    .header h1 { font-size: 32px; }
    .header h2 { font-size: 14px; }
    nav a { font-size: 12px; padding: 5px 10px; }
    .section-title { font-size: 24px; }
}
</style>
</head>
<body>

<div class="header">
    <h1>SEAVIEW REST HOUSE</h1>
    <h2>Your Keyscape to Paradise. Be Amazed as the Experience Lasts</h2>
</div>

<nav>
    <a href="index.html">HOME</a>
    <a href="EVENTS.html">EVENTS</a>
    <a href="CONTACT.html">CONTACT US</a>
    <a href="SERVICES.html">SERVICES</a>
</nav>

<div class="section-title">AFFORDABLE</div>

<div class="gallery">
    <img src="wide.jpg" alt="Image 1">
    <img src="05.jpg" alt="Image 2">
</div>

</body>
</html>
